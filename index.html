<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Frontend Mentor - Stats preview card component solution by Nemo Anderson. This is a solution to the [Stats preview card component challenge on Frontend Mentor](https://www.frontendmentor.io/challenges/stats-preview-card-component-8JqbgoU62)."
    />
    <link rel="stylesheet" href="style.css" />
    <title>Stats preview card component</title>
  </head>
  <body>
    <div class="container">
      <div class="wrapper">
        <div class="card-text">
          <h1 class="title">
            Get <span>insights</span> that help your business grow.
          </h1>
          <p class="subtitle">
            Discover the benefits of data analytics and make better decisions
            regarding revenue, customer and experience, and overall efficiency.
          </p>
          <div class="stats-box">
            <div>
              <h2 class="num">10k+</h2>
              <p>companies</p>
            </div>
            <div>
              <h2 class="num">314</h2>
              <p>templates</p>
            </div>
            <div>
              <h2 class="num">12M+</h2>
              <p>queries</p>
            </div>
          </div>
        </div>
        <div class="img-card">
          <img src="./images/image-header-desktop.jpg" alt="" />
        </div>
      </div>
    </div>
  </body>
</html>
